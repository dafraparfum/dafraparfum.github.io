<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DaFra Parfum</title>

<link rel="icon" type="image/png" sizes="16x16" href="web/favicon.png">

<link rel="icon" type="image/png" sizes="192x192" href="web/icons/Icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="web/icons/Icon-512.png">
<link rel="apple-touch-icon" href="web/icons/Icon-192.png">

<style>
    :root {
        --bg: #0b0b0b;
        --gold: #c6a75e;
        --gold-soft: #e6c97a;
        --text: #f5f5f5;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
        padding: 30px 20px;
    }

    /* HEADER */
    .header {
        position: fixed;
        top: 20px;
        right: 20px;
    }

    .login-btn {
        display: inline-block;
        padding: 5px 16px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 13px;
        letter-spacing: 1px;
        border: 1px solid var(--gold);
        color: var(--gold);
        transition: all 0.25s ease;
        line-height: 1.2;
    }

    .login-btn:hover {
        background: var(--gold);
        color: var(--bg);
    }

    .container {
        width: 100%;
        max-width: 420px;
        animation: fadeIn 0.8s ease forwards;
        opacity: 0;
    }

    /* LOGO WRAPPER (Reserva el espacio) */
    .logo-container {
        width: 256px;
        height: 205px; /* Ajustado al alto de tu logo */
        margin: 0 auto 25px auto;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .logo {
        width: 100%;
        height: auto;
        opacity: 0;
        transition: opacity 1.5s ease; /* Aparición suave */
    }

    /* Clase que se activa cuando la imagen carga */
    .logo-loaded {
        opacity: 1;
    }

    h1 {
        font-size: 28px;
        letter-spacing: 4px;
        font-weight: 300;
        margin-bottom: 10px;
    }

    .tagline {
        font-size: 14px;
        opacity: 0.7;
        margin-bottom: 40px;
    }

    .btn {
        display: block;
        width: 100%;
        padding: 14px;
        margin-bottom: 18px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 15px;
        letter-spacing: 1px;
        font-weight: 500;
        border: 1px solid var(--gold);
        color: var(--gold);
        transition: all 0.25s ease;
    }

    .btn:hover {
        background: var(--gold);
        color: var(--bg);
        transform: translateY(-2px);
    }

    .footer {
        margin-top: 30px;
        font-size: 12px;
        opacity: 0.4;
    }
    .footer a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid transparent;
    }
    
    .footer a:hover {
        border-bottom: 1px solid var(--gold);
    }
	
    /* CATÁLOGO DESPLEGABLE */

    .catalog-section {
        margin-bottom: 18px;
    }

    .catalog-box {
        width: 100%;
        border: 1px solid var(--gold);
        border-radius: 12px;
        overflow: hidden;
        background: rgba(198,167,94,.035);
        box-shadow: 0 8px 30px rgba(0,0,0,.16);
        transition: box-shadow .35s ease, background .35s ease;
    }

    .catalog-box.open {
        background: rgba(198,167,94,.055);
        box-shadow: 0 12px 36px rgba(0,0,0,.24);
    }

    .catalog-btn {
        position: relative;
        display: block;
        width: 100%;
        min-height: 50px;
        padding: 14px 18px;
        border: 0;
        border-radius: 0;
        color: var(--gold);
        background: transparent;
        font: inherit;
        cursor: pointer;
        text-align: center;
        transition: background .3s ease, color .3s ease;
    }

    .catalog-btn:hover {
        background: rgba(198,167,94,.10);
        color: var(--gold-soft);
    }

    .catalog-title {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: .8px;
    }

    .catalog-arrow {
        position: absolute;
        right: 18px;
        width: 9px;
        height: 9px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(45deg) translateY(-3px);
        transition: transform .35s ease;
    }

    .catalog-box.open .catalog-arrow {
        transform: rotate(225deg) translateY(-1px);
    }

    .catalog-links {
        display: grid;
        grid-template-rows: 0fr;
        opacity: 0;
        transition: grid-template-rows .42s cubic-bezier(.22,.61,.36,1),
                    opacity .25s ease;
    }

    .catalog-box.open .catalog-links {
        grid-template-rows: 1fr;
        opacity: 1;
    }

    .catalog-links-inner {
        min-height: 0;
        overflow: hidden;
        padding: 0 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        transition: padding .42s cubic-bezier(.22,.61,.36,1);
    }

    .catalog-box.open .catalog-links-inner {
        padding: 0 10px 10px;
    }

    .catalog-link {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid rgba(198,167,94,.48);
        border-radius: 8px;
        color: var(--gold);
        background: rgba(198,167,94,.035);
        text-decoration: none;
        font-size: 14px;
        line-height: 1.3;
        transform: translateY(-5px);
        transition: background .22s ease, color .22s ease,
                    border-color .22s ease, transform .35s ease;
    }

    .catalog-box.open .catalog-link {
        transform: translateY(0);
    }

    .catalog-link:hover {
        background: var(--gold);
        border-color: var(--gold);
        color: var(--bg);
        transform: translateY(-1px);
    }

    .work-btn {
        margin-bottom: 28px;
    }

    .social-divider {
        width: 100%;
        height: 1px;
        margin: 0 0 28px;
        background: linear-gradient(
            to right,
            transparent,
            rgba(198,167,94,.28) 18%,
            rgba(198,167,94,.28) 82%,
            transparent
        );
    }

    @keyframes fadeIn {
        to { opacity: 1; }
    }

    @media (max-width: 400px) {
        h1 { font-size: 24px; }
        .logo-container { width: 200px; height: 200px; }
    }
</style>
</head>

<body>

<div class="header">
    <a href="web/index.html" class="login-btn">Login</a>
</div>

<div class="container">

    <div class="logo-container">
        <img 
            src="images/logo_page.png"
            alt="DaFra Logo" 
            class="logo" 
            onload="this.classList.add('logo-loaded')"
        >
    </div>
	
    <div class="catalog-section">
        <div class="catalog-box" id="catalogBox">
            <button class="catalog-btn" id="catalogBtn" type="button"
                    aria-expanded="false" aria-controls="catalogLinks">
                <span class="catalog-title">Catálogo</span>
                <span class="catalog-arrow" aria-hidden="true"></span>
            </button>

            <div class="catalog-links" id="catalogLinks">
                <div class="catalog-links-inner">
                    <a href="catalogo.html" class="catalog-link">DaFra Parfum online</a>
                    <a href="pdfs/catalog_dafra_parfum.pdf" class="catalog-link" target="_blank" rel="noopener">DaFra Parfum descargar (PDF)</a>
                    <a href="pdfs/catalog_dafra_indumentaria.pdf" class="catalog-link" target="_blank" rel="noopener">DaFra Indumentaria descargar (PDF)</a>
                </div>
            </div>
        </div>
    </div>

    <a href="trabaja.html" class="btn work-btn">
        Trabajá con Nosotros
    </a>

    <div class="social-divider" aria-hidden="true"></div>

    <a href="https://instagram.com/dafraparfum" class="btn" target="_blank">
        Instagram
    </a>

    <a href="https://facebook.com/DaFraParfum/" class="btn" target="_blank">
        Facebook
    </a>

    <a href="https://wa.me/5493436619832" class="btn" target="_blank">
        WhatsApp
    </a>

    <div class="footer">
        © 2026 DaFra Parfum 
        <span style="margin: 0 6px;">|</span>
        <a href="privacy.html" target="_blank">Política de Privacidad</a>
        <span style="margin: 0 6px;">|</span>
        <a href="delete-account.html" target="_blank">Eliminación de cuenta</a>
    </div>

</div>


<script>
    const catalogBtn = document.getElementById('catalogBtn');
    const catalogBox = document.getElementById('catalogBox');

    catalogBtn.addEventListener('click', () => {
        const isOpen = catalogBox.classList.toggle('open');
        catalogBtn.setAttribute('aria-expanded', isOpen);
    });
</script>

</body>
</html>
